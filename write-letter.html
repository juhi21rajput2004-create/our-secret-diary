<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Write Secret Letter ❤️</title>


<link rel="stylesheet" href="css/write-letter.css">


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


</head>



<body>



<div class="letter-container">



<!-- Back Button -->

<a href="dashboard.html" class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

Back To Diary

</a>




<div class="letter-box">



<h1>

✍️ Write Your Secret Letter ❤️

</h1>



<p class="subtitle">

Write your feelings here... this page is only yours.

</p>




<div class="input-group">


<label>

Letter Title ❤️

</label>


<input 
type="text"
id="title"
placeholder="Example: A little message for you...">


</div>





<div class="input-group">


<label>

Your Feelings 💌

</label>


<textarea

id="message"

placeholder="Write your heart here...">

</textarea>


</div>





<button onclick="sendLetter()" class="save-btn">


<i class="fa-solid fa-heart"></i>

Save Secret Letter


</button>




<a href="saved-letters.html" class="saved-link">


<i class="fa-solid fa-book"></i>

View My Saved Letters


</a>



</div>



</div>





<script src="js/write-letter.js"></script>



</body>

</html>
