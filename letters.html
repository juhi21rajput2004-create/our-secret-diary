<div class="container">

<h1>💌 Letters Written Just For You</h1>

<p class="subtitle">
Every letter is a piece of my heart ❤️
</p>

<div class="letters-grid">

<div class="letter-card">

<i class="fa-solid fa-envelope-open-heart"></i>

<h2>First Meeting</h2>

<p>The day our story started.</p>

<button data-id="1">Read Letter ❤️</button>

</div>

<div class="letter-card">

<i class="fa-solid fa-heart"></i>

<h2>Why I Love You</h2>

<p>Everything I adore about you.</p>

<button data-id="2">Read Letter ❤️</button>

</div>

<div class="letter-card">

<i class="fa-solid fa-star"></i>

<h2>Future Dreams</h2>

<p>Our beautiful future together.</p>

<button data-id="3">Read Letter ❤️</button>

</div>

<div class="letter-card">

<i class="fa-solid fa-gift"></i>

<h2>Open When You Miss Me</h2>

<p>A special message whenever you miss me.</p>

<button data-id="4">Read Letter ❤️</button>

</div>

</div>

</div>
